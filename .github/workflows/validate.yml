name: Validate Kolla image configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository configuration and publish plans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Parse every JSON file
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -print0 |
            while IFS= read -r -d '' json_file; do
              python3 -m json.tool "$json_file" >/dev/null
            done

      - name: Resolve validation branch context
        id: validation-context
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          validation_branch=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            validation_branch="$BASE_REF"
            if [ "$validation_branch" != "main" ] && [[ ! "$validation_branch" =~ ^[0-9]{4}-[0-9]+$ ]]; then
              echo "Pull requests must target main or an exact YYYY-N release branch." >&2
              exit 1
            fi
          elif [ "$REF_TYPE" = "branch" ] && { [ "$REF_NAME" = "main" ] || [[ "$REF_NAME" =~ ^[0-9]{4}-[0-9]+$ ]]; }; then
            validation_branch="$REF_NAME"
          fi
          printf 'branch=%s\n' "$validation_branch" >> "$GITHUB_OUTPUT"

      - name: Validate release branch ownership
        if: >-
          ${{ steps.validation-context.outputs.branch != '' &&
              steps.validation-context.outputs.branch != 'main' }}
        env:
          VALIDATION_BRANCH: ${{ steps.validation-context.outputs.branch }}
        run: >-
          python3 scripts/validate-release-context.py matrix
          --matrix config/build-matrix.json
          --branch "$VALIDATION_BRANCH"

      - name: Validate repository configuration
        env:
          VALIDATION_BRANCH: ${{ steps.validation-context.outputs.branch }}
        run: |
          set -euo pipefail
          validation_args=()
          if [ -n "$VALIDATION_BRANCH" ]; then
            validation_args+=(--branch "$VALIDATION_BRANCH")
          fi
          python3 scripts/validate-config.py "${validation_args[@]}"

      - name: Validate every active stream dry-run plan
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          matrix = json.loads(
              pathlib.Path("config/build-matrix.json").read_text(encoding="utf-8")
          )
          active_streams = [
              stream["id"]
              for stream in matrix["streams"]
              if stream["publish_enabled"] is True
          ]
          if not active_streams:
              raise SystemExit("branch matrix must contain an active stream")
          for stream in active_streams:
              for profile in matrix["profiles"]:
                  subprocess.run(
                      [
                          sys.executable,
                          "scripts/plan-publish.py",
                          "--stream",
                          stream,
                          "--profile",
                          profile,
                          "--dry-run",
                      ],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/plan-publish.py",
                      "--stream",
                      stream,
                      "--profile",
                      "core",
                      "--image",
                      "keystone",
                      "--dry-run",
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
          PY

      - name: Run complete unit suite
        run: python3 -m unittest discover -s tests -v
