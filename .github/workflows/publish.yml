name: Publish Kolla images
run-name: Kolla ${{ inputs.operation }} · ${{ github.ref_name }} · ${{ inputs.stream }} · ${{ inputs.scope }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Render a plan or publish it after environment approval
        required: true
        type: choice
        options:
          - plan
          - publish
        default: plan
      stream:
        description: Exact build stream ID from config/build-matrix.json
        required: true
        type: string
      scope:
        description: Reviewed image scope
        required: true
        type: choice
        options:
          - keystone
          - core
          - deployment
        default: keystone

concurrency:
  group: ${{ inputs.operation == 'publish' && format('kolla-publish-{0}-{1}', github.ref_name, inputs.stream) || format('kolla-plan-{0}', github.run_id) }}
  queue: max

permissions:
  contents: read

jobs:
  publish-plan:
    name: Render frozen publish plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.operation == 'plan' && format('kolla-plan-{0}-{1}', github.ref_name, inputs.stream) || format('kolla-publish-plan-{0}', github.run_id) }}
      cancel-in-progress: ${{ inputs.operation == 'plan' }}
    outputs:
      parent_tier_0_matrix: ${{ steps.publish-matrices.outputs.parent_tier_0_matrix }}
      parent_tier_1_matrix: ${{ steps.publish-matrices.outputs.parent_tier_1_matrix }}
      parent_tier_2_matrix: ${{ steps.publish-matrices.outputs.parent_tier_2_matrix }}
      leaf_stage_0_matrix: ${{ steps.publish-matrices.outputs.leaf_stage_0_matrix }}
      leaf_stage_1_matrix: ${{ steps.publish-matrices.outputs.leaf_stage_1_matrix }}
      leaf_stage_1_count: ${{ steps.publish-matrices.outputs.leaf_stage_1_count }}

    steps:
      - name: Require repository-owned invocation
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CALLER_REPOSITORY" != "supergate-hub/kolla-container-images" ]; then
            echo "This publish workflow only accepts repository-owned dispatches." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate release branch matrix
        if: ${{ inputs.operation == 'publish' }}
        env:
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: >-
          python3 scripts/validate-release-context.py matrix
          --matrix config/build-matrix.json
          --branch "$PUBLISH_BRANCH"

      - name: Check out pinned OpenStack release metadata
        env:
          CHECKOUT_PATH: ${{ runner.temp }}/openstack-releases
          RELEASES_REPOSITORY: https://opendev.org/openstack/releases
        run: |
          set -euo pipefail
          RELEASES_COMMIT="$(python3 - <<'PY'
          import json
          import pathlib

          matrix = json.loads(
              pathlib.Path("config/build-matrix.json").read_text(encoding="utf-8")
          )
          print(matrix["release_metadata"]["commit"])
          PY
          )"
          if [[ ! "$RELEASES_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pinned OpenStack release metadata commit must be a full SHA." >&2
            exit 1
          fi
          if [ "$CHECKOUT_PATH" != "$RUNNER_TEMP/openstack-releases" ]; then
            echo "Refusing unexpected OpenStack release metadata checkout path." >&2
            exit 1
          fi
          if [ -e "$CHECKOUT_PATH" ]; then
            echo "OpenStack release metadata checkout path already exists." >&2
            exit 1
          fi
          git init --quiet "$CHECKOUT_PATH"
          git -C "$CHECKOUT_PATH" remote add origin "$RELEASES_REPOSITORY"
          git -C "$CHECKOUT_PATH" fetch --no-tags --depth=1 origin "$RELEASES_COMMIT"
          git -C "$CHECKOUT_PATH" checkout --quiet --detach FETCH_HEAD

      - name: Validate repository configuration
        env:
          RELEASE_METADATA_CHECKOUT: ${{ runner.temp }}/openstack-releases
        run: >-
          python3 scripts/validate-config.py
          --release-metadata-checkout "$RELEASE_METADATA_CHECKOUT"

      - name: Render frozen publish plan
        env:
          STREAM: ${{ inputs.stream }}
          SCOPE: ${{ inputs.scope }}
          CANDIDATE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$SCOPE" in
            keystone)
              profile="core"
              image="keystone"
              ;;
            core)
              profile="core"
              image="all"
              ;;
            deployment)
              profile="deployment"
              image="all"
              ;;
            *)
              echo "Unsupported publish scope: $SCOPE" >&2
              exit 1
              ;;
          esac
          mkdir -p artifacts/plan
          plan_args=(
            --stream "$STREAM"
            --profile "$profile"
            --candidate-id "$CANDIDATE_ID"
            --dry-run
          )
          if [ "$image" != "all" ]; then
            plan_args+=(--image "$image")
          fi
          python3 scripts/plan-publish.py "${plan_args[@]}" > artifacts/plan/publish-plan.json

      - name: Bind frozen plan to release ref
        if: ${{ inputs.operation == 'publish' }}
        env:
          PUBLISH_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          python3 scripts/validate-release-context.py publish
          --matrix config/build-matrix.json
          --publish-plan artifacts/plan/publish-plan.json
          --git-ref "$PUBLISH_REF"
          --require-protected
          --ref-protected "$REF_PROTECTED"

      - name: Reject disabled publish stream
        if: ${{ inputs.operation == 'publish' }}
        env:
          STREAM: ${{ inputs.stream }}
        run: |
          python3 - <<'PY'
          import os

          from scripts.profile_resolver import find_stream, load_matrix

          stream = find_stream(load_matrix(), os.environ["STREAM"])
          if stream.get("publish_enabled") is not True:
              raise SystemExit(f"Stream {stream['id']} is disabled for publication")
          PY

      - name: Publish dynamic build matrices
        id: publish-matrices
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          plan = json.loads(
              pathlib.Path("artifacts/plan/publish-plan.json").read_text(encoding="utf-8")
          )
          parent_tiers = plan["build"]["parent_tiers"]
          if [entry["tier"] for entry in parent_tiers] != [0, 1, 2]:
              raise SystemExit("frozen plan must contain parent tiers 0, 1, and 2")
          matrices = {
              f"parent_tier_{entry['tier']}_matrix": entry["matrix"]
              for entry in parent_tiers
          }
          leaf_stages = plan["build"]["leaf_stages"]
          if [entry["stage"] for entry in leaf_stages] != [0, 1]:
              raise SystemExit("frozen plan must contain leaf stages 0 and 1")
          matrices.update(
              {
                  f"leaf_stage_{entry['stage']}_matrix": entry["matrix"]
                  for entry in leaf_stages
              }
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, matrix in matrices.items():
                  if not isinstance(matrix, dict) or not isinstance(matrix.get("include"), list):
                      raise SystemExit(f"{name} must be a matrix object with include")
                  output.write(
                      f"{name}={json.dumps(matrix, separators=(',', ':'))}\n"
                  )
              output.write(
                  f"leaf_stage_1_count={len(matrices['leaf_stage_1_matrix']['include'])}\n"
              )
          PY

      - name: Write plan summary
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          PUBLISH_BRANCH: ${{ github.ref_name }}
          PUBLISH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          plan = json.loads(
              pathlib.Path("artifacts/plan/publish-plan.json").read_text(encoding="utf-8")
          )
          scope = plan["scope"]
          lines = [
              "# Kolla publish plan",
              "",
              f"- Operation: `{os.environ['OPERATION']}`",
              f"- Branch: `{os.environ['PUBLISH_BRANCH']}`",
              f"- Commit: `{os.environ['PUBLISH_SHA']}`",
              f"- Stream: `{plan['stream']}`",
              (
                  f"- Scope: `{os.environ['REQUESTED_SCOPE']}` "
                  f"(`{scope['profile']}/{scope['image']}`, {scope['image_count']} images)"
              ),
              f"- Candidate ID: `{plan['candidate_id']}`",
              f"- Kolla: `{plan['kolla']['version']}@{plan['kolla']['commit']}`",
              (
                  "- Kolla-Ansible: "
                  f"`{plan['kolla_ansible']['version']}@{plan['kolla_ansible']['commit']}`"
              ),
          ]
          base = plan.get("base")
          if isinstance(base, dict):
              requested_ref = base.get("requested_ref") or base.get("image_ref")
              if requested_ref:
                  lines.append(f"- Base: `{requested_ref}`")
              if base.get("index_digest"):
                  lines.append(f"- Base index digest: `{base['index_digest']}`")
              platforms = base.get("platforms")
              if isinstance(platforms, dict):
                  for architecture in ("amd64", "arm64"):
                      descriptor = platforms.get(architecture)
                      if isinstance(descriptor, dict) and descriptor.get("digest"):
                          lines.append(
                              f"- Base linux/{architecture}: `{descriptor['digest']}`"
                          )
          openstack_sources = plan.get("openstack_sources")
          if isinstance(openstack_sources, dict):
              source_set = openstack_sources.get("source_set")
              source_id = (
                  source_set.get("id") if isinstance(source_set, dict) else None
              )
              source_digest = openstack_sources.get("canonical_digest")
              if source_id:
                  lines.append(f"- OpenStack source set: `{source_id}`")
              if source_digest:
                  lines.append(f"- Source-set digest: `{source_digest}`")
          if plan.get("images"):
              first_image = plan["images"][0]
              lines.extend(
                  [
                      f"- Semantic tag: `{first_image['semantic_tag']}`",
                      f"- Revision tag: `{first_image['revision_tag']}`",
                  ]
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload publish plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plan/publish-plan.json
          if-no-files-found: error
          retention-days: 7

  authorize-publish:
    name: Authorize frozen publish plan
    if: ${{ inputs.operation == 'publish' }}
    needs: publish-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ghcr-publish
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download publish plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plan

      - name: Validate protected release context
        env:
          PUBLISH_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          python3 scripts/validate-release-context.py publish
          --matrix config/build-matrix.json
          --publish-plan artifacts/plan/publish-plan.json
          --git-ref "$PUBLISH_REF"
          --require-protected
          --ref-protected "$REF_PROTECTED"

      - name: Validate publish authorization
        env:
          ALLOW_GHCR_PUBLISH: ${{ vars.ALLOW_GHCR_PUBLISH }}
          ALLOW_GHCR_FULL_CORE_PUBLISH: ${{ vars.ALLOW_GHCR_FULL_CORE_PUBLISH }}
          ALLOW_GHCR_DEPLOYMENT_PUBLISH: ${{ vars.ALLOW_GHCR_DEPLOYMENT_PUBLISH }}
          CANDIDATE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_SCOPE: ${{ inputs.scope }}
        run: >-
          python3 scripts/validate-publish-approval.py
          --publish-plan artifacts/plan/publish-plan.json
          --expected-candidate-id "$CANDIDATE_ID"
          --expected-scope "$PUBLISH_SCOPE"

  build-parent-tier-0:
    name: Parent tier 0 / ${{ matrix.arch }} / ${{ matrix.target }}
    if: ${{ inputs.operation == 'publish' }}
    needs: [publish-plan, authorize-publish]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.publish-plan.outputs.parent_tier_0_matrix) }}
    uses: ./.github/workflows/build-unit.yml
    with:
      unit: ${{ toJSON(matrix) }}
      publish_plan_artifact: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
      publish_scope: ${{ inputs.scope }}
    permissions:
      contents: read
      packages: write

  build-parent-tier-1:
    name: Parent tier 1 / ${{ matrix.arch }} / ${{ matrix.target }}
    if: ${{ inputs.operation == 'publish' }}
    needs: [publish-plan, authorize-publish, build-parent-tier-0]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.publish-plan.outputs.parent_tier_1_matrix) }}
    uses: ./.github/workflows/build-unit.yml
    with:
      unit: ${{ toJSON(matrix) }}
      publish_plan_artifact: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
      input_evidence_artifact_pattern: unit-evidence-*-parent-*-${{ github.run_id }}-${{ github.run_attempt }}
      publish_scope: ${{ inputs.scope }}
    permissions:
      contents: read
      packages: write

  build-parent-tier-2:
    name: Parent tier 2 / ${{ matrix.arch }} / ${{ matrix.target }}
    if: ${{ inputs.operation == 'publish' }}
    needs: [publish-plan, authorize-publish, build-parent-tier-1]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.publish-plan.outputs.parent_tier_2_matrix) }}
    uses: ./.github/workflows/build-unit.yml
    with:
      unit: ${{ toJSON(matrix) }}
      publish_plan_artifact: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
      input_evidence_artifact_pattern: unit-evidence-*-parent-*-${{ github.run_id }}-${{ github.run_attempt }}
      publish_scope: ${{ inputs.scope }}
    permissions:
      contents: read
      packages: write

  build-leaf-stage-0:
    name: Leaf stage 0 / ${{ matrix.arch }} / ${{ matrix.target }}
    if: ${{ inputs.operation == 'publish' }}
    needs: [publish-plan, authorize-publish, build-parent-tier-2]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.publish-plan.outputs.leaf_stage_0_matrix) }}
    uses: ./.github/workflows/build-unit.yml
    with:
      unit: ${{ toJSON(matrix) }}
      publish_plan_artifact: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
      input_evidence_artifact_pattern: unit-evidence-*-parent-*-${{ github.run_id }}-${{ github.run_attempt }}
      publish_scope: ${{ inputs.scope }}
    permissions:
      contents: read
      packages: write

  build-leaf-stage-1:
    name: Leaf stage 1 / ${{ matrix.arch }} / ${{ matrix.target }}
    if: ${{ inputs.operation == 'publish' && needs.publish-plan.outputs.leaf_stage_1_count != '0' }}
    needs: [publish-plan, authorize-publish, build-leaf-stage-0]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.publish-plan.outputs.leaf_stage_1_matrix) }}
    uses: ./.github/workflows/build-unit.yml
    with:
      unit: ${{ toJSON(matrix) }}
      publish_plan_artifact: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
      input_evidence_artifact_pattern: unit-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
      publish_scope: ${{ inputs.scope }}
    permissions:
      contents: read
      packages: write

  collect-native-evidence:
    name: Collect native evidence
    if: >-
      ${{ inputs.operation == 'publish' && !cancelled() &&
          needs.build-leaf-stage-0.result == 'success' &&
          (needs.build-leaf-stage-1.result == 'success' ||
           (needs.build-leaf-stage-1.result == 'skipped' &&
            needs.publish-plan.outputs.leaf_stage_1_count == '0')) }}
    needs: [publish-plan, build-leaf-stage-0, build-leaf-stage-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download publish plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plan

      - name: Download all unit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unit-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/unit-evidence
          merge-multiple: true

      - name: Validate and collect native evidence
        run: >-
          python3 scripts/aggregate-native-evidence.py
          --publish-plan artifacts/plan/publish-plan.json
          --unit-evidence-dir artifacts/unit-evidence
          --output-dir artifacts/arch

      - name: Upload amd64 native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/arch/native-amd64.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload arm64 native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/arch/native-arm64.json
          if-no-files-found: error
          retention-days: 7

  finalize-publish:
    name: Finalize manifests, summary, and candidate lock
    if: >-
      ${{ inputs.operation == 'publish' && !cancelled() &&
          needs.collect-native-evidence.result == 'success' }}
    needs: collect-native-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download publish plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plan

      - name: Download amd64 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/arch

      - name: Download arm64 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/arch

      - name: Revalidate protected release context
        env:
          PUBLISH_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          python3 scripts/validate-release-context.py publish
          --matrix config/build-matrix.json
          --publish-plan artifacts/plan/publish-plan.json
          --git-ref "$PUBLISH_REF"
          --require-protected
          --ref-protected "$REF_PROTECTED"

      - name: Revalidate publish authorization
        env:
          ALLOW_GHCR_PUBLISH: ${{ vars.ALLOW_GHCR_PUBLISH }}
          ALLOW_GHCR_FULL_CORE_PUBLISH: ${{ vars.ALLOW_GHCR_FULL_CORE_PUBLISH }}
          ALLOW_GHCR_DEPLOYMENT_PUBLISH: ${{ vars.ALLOW_GHCR_DEPLOYMENT_PUBLISH }}
          CANDIDATE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_SCOPE: ${{ inputs.scope }}
        run: >-
          python3 scripts/validate-publish-approval.py
          --publish-plan artifacts/plan/publish-plan.json
          --expected-candidate-id "$CANDIDATE_ID"
          --expected-scope "$PUBLISH_SCOPE"

      - name: Prepare ephemeral Docker client state
        env:
          DOCKER_CONFIG_SUFFIX: finalize
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/kolla-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DOCKER_CONFIG_SUFFIX"
          case "$docker_config" in
            "$RUNNER_TEMP"/kolla-docker-*) ;;
            *) echo "Refusing unsafe Docker config path: $docker_config" >&2; exit 1 ;;
          esac
          rm -rf -- "$docker_config"
          install -d -m 0700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Create and verify final multi-architecture manifests
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          DIGEST_RE = re.compile(r"^sha256:[a-f0-9]{64}$")
          MULTIARCH_MEDIA_TYPES = {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }
          EXPECTED_ARCHES = ("amd64", "arm64")
          EXPECTED_MACHINES = {"amd64": "x86_64", "arm64": "aarch64"}
          EXPECTED_EVIDENCE_KEYS = {
              "schema_version",
              "stream",
              "arch",
              "platform",
              "runner_machine",
              "kolla",
              "base",
              "openstack_sources",
              "parents",
              "images",
          }
          EXPECTED_PARENT_KEYS = {"image", "arch_ref", "digest", "immutable_ref"}
          EXPECTED_IMAGE_KEYS = {
              "image",
              "arch_ref",
              "digest",
              "immutable_ref",
              "smoke",
          }

          plan = json.loads(
              pathlib.Path("artifacts/plan/publish-plan.json").read_text(encoding="utf-8")
          )
          planned_architectures = plan["build"]["architectures"]
          if [entry["arch"] for entry in planned_architectures] != list(EXPECTED_ARCHES):
              raise SystemExit("frozen plan architectures must be exactly amd64 and arm64")
          planned_by_arch = {entry["arch"]: entry for entry in planned_architectures}
          expected_image_names = [entry["image"] for entry in plan["images"]]
          if len(expected_image_names) != len(set(expected_image_names)):
              raise SystemExit("frozen plan contains duplicate leaf images")

          evidence_by_arch = {}
          for arch in EXPECTED_ARCHES:
              evidence_path = pathlib.Path(f"artifacts/arch/native-{arch}.json")
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
              if not isinstance(evidence, dict) or set(evidence) != EXPECTED_EVIDENCE_KEYS:
                  raise SystemExit(f"native-{arch} evidence schema is invalid")
              if type(evidence["schema_version"]) is not int or evidence["schema_version"] != 3:
                  raise SystemExit(f"native-{arch} evidence schema version must be 3")
              if evidence["stream"] != plan["stream"]:
                  raise SystemExit(f"native-{arch} stream does not match frozen scope")
              if evidence["arch"] != arch or evidence["platform"] != f"linux/{arch}":
                  raise SystemExit(f"native-{arch} architecture identity is invalid")
              if evidence["runner_machine"] != EXPECTED_MACHINES[arch]:
                  raise SystemExit(f"native-{arch} runner machine is invalid")
              if evidence["kolla"] != plan["kolla"]:
                  raise SystemExit(f"native-{arch} Kolla pin does not match frozen plan")
              if evidence["base"] != plan["base"]:
                  raise SystemExit(f"native-{arch} base pin does not match frozen plan")
              if evidence["openstack_sources"] != plan["openstack_sources"]:
                  raise SystemExit(
                      f"native-{arch} OpenStack source pins do not match frozen plan"
                  )

              planned_arch = planned_by_arch[arch]
              expected_parent_names = [
                  entry["image"] for entry in planned_arch["parents"]
              ]
              expected_leaf_names = [entry["image"] for entry in planned_arch["images"]]
              if expected_leaf_names != expected_image_names:
                  raise SystemExit(f"native-{arch} planned leaf order is inconsistent")

              def validate_records(records, planned_records, expected_keys, label):
                  if not isinstance(records, list):
                      raise SystemExit(f"native-{arch} {label} must be a list")
                  records_by_name = {}
                  for record in records:
                      if not isinstance(record, dict) or set(record) != expected_keys:
                          raise SystemExit(f"native-{arch} {label} record schema is invalid")
                      name = record["image"]
                      if not isinstance(name, str) or name in records_by_name:
                          raise SystemExit(f"native-{arch} {label} contains a duplicate image")
                      records_by_name[name] = record
                  planned_by_name = {entry["image"]: entry for entry in planned_records}
                  if len(planned_by_name) != len(planned_records):
                      raise SystemExit(f"frozen plan contains duplicate {label}")
                  if set(records_by_name) != set(planned_by_name):
                      raise SystemExit(f"native-{arch} {label} set does not match frozen plan")
                  for name, record in records_by_name.items():
                      planned_record = planned_by_name[name]
                      if record["arch_ref"] != planned_record["revision_arch_ref"]:
                          raise SystemExit(f"native-{arch} {label} arch ref mismatch: {name}")
                      digest = record["digest"]
                      if not isinstance(digest, str) or not DIGEST_RE.fullmatch(digest):
                          raise SystemExit(f"native-{arch} {label} digest is invalid: {name}")
                      image_repository, separator, tag = record["arch_ref"].rpartition(":")
                      if not separator or not tag:
                          raise SystemExit(f"native-{arch} {label} ref is invalid: {name}")
                      immutable_ref = f"{image_repository}@{digest}"
                      if record["immutable_ref"] != immutable_ref:
                          raise SystemExit(
                              f"native-{arch} {label} immutable ref mismatch: {name}"
                          )
                  return records_by_name

              parents_by_name = validate_records(
                  evidence["parents"],
                  planned_arch["parents"],
                  EXPECTED_PARENT_KEYS,
                  "parents",
              )
              if set(parents_by_name) != set(expected_parent_names):
                  raise SystemExit(f"native-{arch} parent evidence is incomplete")
              images_by_name = validate_records(
                  evidence["images"],
                  planned_arch["images"],
                  EXPECTED_IMAGE_KEYS,
                  "images",
              )
              if set(images_by_name) != set(expected_image_names):
                  raise SystemExit(f"native-{arch} leaf evidence is incomplete")
              for name, record in images_by_name.items():
                  if (
                      not isinstance(record["smoke"], dict)
                      or set(record["smoke"]) != {"platform", "entrypoint", "passed"}
                      or record["smoke"].get("platform") != f"linux/{arch}"
                      or record["smoke"].get("entrypoint") != "/bin/true"
                      or record["smoke"].get("passed") is not True
                  ):
                      raise SystemExit(f"native-{arch} smoke evidence is invalid: {name}")
              evidence_by_arch[arch] = {
                  "parents": parents_by_name,
                  "images": images_by_name,
              }

          manifests_dir = pathlib.Path("artifacts/manifests")
          manifests_dir.mkdir(parents=True, exist_ok=True)
          publish_summary = {
              "schema_version": 3,
              "candidate_id": plan["candidate_id"],
              "stream": plan["stream"],
              "release": plan["release"],
              "release_series": plan["release_series"],
              "release_branch": plan["release_branch"],
              "release_metadata": plan["release_metadata"],
              "kolla": plan["kolla"],
              "kolla_ansible": plan["kolla_ansible"],
              "base": plan["base"],
              "openstack_sources": {
                  "source_set": plan["openstack_sources"]["source_set"],
                  "canonical_digest": plan["openstack_sources"][
                      "canonical_digest"
                  ],
                  "kolla_build_config_sha256": plan["openstack_sources"][
                      "kolla_build_config"
                  ]["sha256"],
                  "template_override_sha256": plan["openstack_sources"][
                      "template_override"
                  ]["sha256"],
              },
              "distro": plan["distro"],
              "distro_version": plan["distro_version"],
              "profile": plan["profile"],
              "scope": plan["scope"],
              "registry": plan["registry"],
              "owner": plan["owner"],
              "repository": plan["repository"],
              "images": [],
          }

          for image in plan["images"]:
              image_name = image["image"]
              semantic_ref = image["semantic_ref"]
              revision_ref = image["revision_ref"]
              if semantic_ref == revision_ref:
                  raise SystemExit(f"semantic and revision refs must differ: {image_name}")
              recorded_child_digests = {}
              child_refs = []
              architecture_summaries = []
              for arch in EXPECTED_ARCHES:
                  record = evidence_by_arch[arch]["images"][image_name]
                  planned_architecture = next(
                      entry
                      for entry in image["architectures"]
                      if entry["arch"] == arch
                  )
                  if record["arch_ref"] != planned_architecture["revision_arch_ref"]:
                      raise SystemExit(
                          f"native-{arch} revision architecture ref mismatch: {image_name}"
                      )
                  repository = record["arch_ref"].rsplit(":", 1)[0]
                  child_ref = f"{repository}@{record['digest']}"
                  if child_ref != record["immutable_ref"]:
                      raise SystemExit(f"recorded immutable child ref mismatch: {image_name}")
                  child_refs.append(child_ref)
                  recorded_child_digests[f"linux/{arch}"] = record["digest"]
                  architecture_summaries.append(
                      {
                          "arch": arch,
                          "platform": f"linux/{arch}",
                          "revision_arch_ref": planned_architecture[
                              "revision_arch_ref"
                          ],
                          "digest": record["digest"],
                      }
                  )

              metadata_path = pathlib.Path(image["manifest_metadata_file"])
              metadata_path.parent.mkdir(parents=True, exist_ok=True)
              create_command = [
                  "docker",
                  "buildx",
                  "imagetools",
                  "create",
                  "--tag",
                  revision_ref,
                  "--metadata-file",
                  str(metadata_path),
                  *child_refs,
              ]
              subprocess.run(create_command, check=True)

              manifest_metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if not isinstance(manifest_metadata, dict):
                  raise SystemExit(f"manifest metadata must be an object: {image_name}")
              manifest_descriptor = manifest_metadata.get("containerimage.descriptor")
              if not isinstance(manifest_descriptor, dict):
                  raise SystemExit(
                      f"manifest metadata descriptor is invalid: {image_name}"
                  )
              manifest_digest = manifest_descriptor.get("digest")
              if not isinstance(manifest_digest, str) or not DIGEST_RE.fullmatch(manifest_digest):
                  raise SystemExit(f"manifest metadata digest is invalid: {image_name}")
              metadata_digest = manifest_metadata.get("containerimage.digest")
              if metadata_digest is not None and metadata_digest != manifest_digest:
                  raise SystemExit(
                      f"manifest metadata digest fields disagree: {image_name}"
                  )
              manifest_media_type = manifest_descriptor.get("mediaType")
              if manifest_media_type not in MULTIARCH_MEDIA_TYPES:
                  raise SystemExit(
                      f"manifest metadata media type is invalid: {image_name}"
                  )
              manifest_size = manifest_descriptor.get("size")
              if type(manifest_size) is not int or manifest_size <= 0:
                  raise SystemExit(f"manifest metadata size is invalid: {image_name}")

              repository, separator, revision_tag = revision_ref.rpartition(":")
              if not separator or not repository or not revision_tag:
                  raise SystemExit(f"revision reference is invalid: {image_name}")
              immutable_manifest_ref = f"{repository}@{manifest_digest}"
              raw_result = subprocess.run(
                  [
                      "docker",
                      "buildx",
                      "imagetools",
                      "inspect",
                      "--raw",
                      immutable_manifest_ref,
                  ],
                  check=True,
                  capture_output=True,
              )
              raw_bytes = raw_result.stdout
              raw_digest = f"sha256:{hashlib.sha256(raw_bytes).hexdigest()}"
              if raw_digest != manifest_digest:
                  raise SystemExit(
                      f"raw multi-architecture manifest digest does not match metadata: {image_name}"
                  )
              if manifest_size != len(raw_bytes):
                  raise SystemExit(
                      f"raw multi-architecture manifest size does not match metadata: {image_name}"
                  )

              tagged_raw_result = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", revision_ref],
                  check=True,
                  capture_output=True,
              )
              if tagged_raw_result.stdout != raw_bytes:
                  raise SystemExit(
                      f"revision tag moved during manifest validation: {image_name}"
                  )

              raw_path = manifests_dir / f"{image_name}-{plan['stream']}-multiarch-manifest.json"
              raw_path.write_bytes(raw_bytes)
              try:
                  index = json.loads(raw_bytes)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"raw multi-architecture manifest is not JSON: {image_name}: {exc}"
                  ) from exc
              if not isinstance(index, dict):
                  raise SystemExit(
                      f"raw multi-architecture manifest must be an object: {image_name}"
                  )
              if index.get("schemaVersion") != 2:
                  raise SystemExit(
                      f"raw multi-architecture manifest schemaVersion must be 2: {image_name}"
                  )
              if index.get("mediaType") != manifest_media_type:
                  raise SystemExit(
                      f"raw manifest media type does not match metadata: {image_name}"
                  )
              if "annotations" in index:
                  raise SystemExit(
                      f"multi-architecture manifest annotations are not allowed: {image_name}"
                  )
              if not isinstance(index.get("manifests"), list) or len(index["manifests"]) != 2:
                  raise SystemExit(
                      f"multi-architecture manifest must contain exactly two descriptors: {image_name}"
                  )

              descriptors_by_platform = {}
              for descriptor in index["manifests"]:
                  if not isinstance(descriptor, dict):
                      raise SystemExit(
                          f"multi-architecture descriptor must be an object: {image_name}"
                      )
                  if "annotations" in descriptor:
                      raise SystemExit(
                          f"multi-architecture descriptor annotations are not allowed: {image_name}"
                      )
                  descriptor_platform = descriptor.get("platform")
                  if not isinstance(descriptor_platform, dict):
                      raise SystemExit(
                          f"multi-architecture descriptor platform is invalid: {image_name}"
                      )
                  platform_name = (
                      f"{descriptor_platform.get('os')}/"
                      f"{descriptor_platform.get('architecture')}"
                  )
                  if platform_name in descriptors_by_platform:
                      raise SystemExit(
                          f"multi-architecture manifest contains duplicate platform: {platform_name}"
                      )
                  digest = descriptor.get("digest")
                  if not isinstance(digest, str) or not DIGEST_RE.fullmatch(digest):
                      raise SystemExit(
                          f"multi-architecture descriptor digest is invalid: {image_name}"
                      )
                  descriptors_by_platform[platform_name] = digest
              if set(descriptors_by_platform) != {"linux/amd64", "linux/arm64"}:
                  raise SystemExit(
                      f"multi-architecture manifest platforms are invalid: {image_name}"
                  )
              if descriptors_by_platform != recorded_child_digests:
                  raise SystemExit(
                      f"multi-architecture child digests do not match evidence: {image_name}"
                  )

              publish_summary["images"].append(
                  {
                      "image": image_name,
                      "kolla_ansible_variables": image["kolla_ansible_variables"],
                      "semantic_tag": image["semantic_tag"],
                      "semantic_ref": semantic_ref,
                      "revision_tag": image["revision_tag"],
                      "revision_ref": revision_ref,
                      "manifest_digest": manifest_digest,
                      "immutable_ref": immutable_manifest_ref,
                      "architectures": architecture_summaries,
                  }
              )

          summary_path = pathlib.Path(plan["publish_summary_file"])
          expected_summary_path = pathlib.Path(
              f"artifacts/publish-summary-{plan['stream']}.json"
          )
          if summary_path != expected_summary_path:
              raise SystemExit("frozen plan publish summary path is invalid")
          summary_path.write_text(
              json.dumps(publish_summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate summary and generate eligible candidate lock
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          plan = json.loads(
              pathlib.Path("artifacts/plan/publish-plan.json").read_text(encoding="utf-8")
          )
          summary_path = pathlib.Path(plan["publish_summary_file"])
          validate_command = [
              sys.executable,
              "scripts/validate-publish-summary.py",
              "--publish-summary",
              str(summary_path),
              "--stream",
              plan["stream"],
              "--profile",
              plan["profile"],
              "--candidate-id",
              plan["candidate_id"],
          ]
          if plan["image_filter"] is not None:
              validate_command.extend(["--allow-partial", "--image", plan["image_filter"]])
          subprocess.run(validate_command, check=True)

          if plan["scope"] == {
              "profile": "deployment",
              "image": "all",
              "image_count": len(plan["images"]),
          }:
              lock_path = pathlib.Path(plan["kolla_ansible_lock_file"])
              expected_lock_path = pathlib.Path(
                  f"artifacts/kolla-ansible-image-lock-{plan['stream']}.yml"
              )
              if lock_path != expected_lock_path:
                  raise SystemExit("frozen plan candidate lock path is invalid")
              subprocess.run(
                  [
                      sys.executable,
                      "scripts/generate-lock.py",
                      "--publish-summary",
                      str(summary_path),
                      "--stream",
                      plan["stream"],
                      "--profile",
                      "deployment",
                      "--candidate-id",
                      plan["candidate_id"],
                      "--output",
                      str(lock_path),
                  ],
                  check=True,
              )
          else:
              if plan["kolla_ansible_lock_file"] is not None:
                  raise SystemExit("candidate lock is forbidden outside deployment/all")
          PY

      - name: Upload publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-${{ inputs.stream }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/publish-summary-${{ inputs.stream }}.json
            artifacts/kolla-ansible-image-lock-${{ inputs.stream }}.yml
            artifacts/manifests/
          if-no-files-found: error
          retention-days: 7

      - name: Update and verify semantic aliases
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          DIGEST_RE = re.compile(r"^sha256:[a-f0-9]{64}$")
          plan = json.loads(
              pathlib.Path("artifacts/plan/publish-plan.json").read_text(encoding="utf-8")
          )
          summary = json.loads(
              pathlib.Path(plan["publish_summary_file"]).read_text(encoding="utf-8")
          )
          planned_by_name = {entry["image"]: entry for entry in plan["images"]}
          summary_by_name = {entry["image"]: entry for entry in summary["images"]}
          if (
              len(planned_by_name) != len(plan["images"])
              or len(summary_by_name) != len(summary["images"])
              or set(planned_by_name) != set(summary_by_name)
          ):
              raise SystemExit("summary image set does not match frozen plan")

          for image_name, planned in planned_by_name.items():
              published = summary_by_name[image_name]
              semantic_ref = planned["semantic_ref"]
              revision_ref = planned["revision_ref"]
              if (
                  published["semantic_ref"] != semantic_ref
                  or published["revision_ref"] != revision_ref
                  or semantic_ref == revision_ref
              ):
                  raise SystemExit(f"summary refs do not match frozen plan: {image_name}")
              manifest_digest = published["manifest_digest"]
              if not isinstance(manifest_digest, str) or not DIGEST_RE.fullmatch(
                  manifest_digest
              ):
                  raise SystemExit(f"summary manifest digest is invalid: {image_name}")
              repository, separator, revision_tag = revision_ref.rpartition(":")
              if not separator or not repository or not revision_tag:
                  raise SystemExit(f"revision ref is invalid: {image_name}")
              immutable_ref = f"{repository}@{manifest_digest}"
              if published["immutable_ref"] != immutable_ref:
                  raise SystemExit(f"summary immutable ref is invalid: {image_name}")

              revision_raw = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", immutable_ref],
                  check=True,
                  capture_output=True,
              )
              resolved_digest = f"sha256:{hashlib.sha256(revision_raw.stdout).hexdigest()}"
              if resolved_digest != manifest_digest:
                  raise SystemExit(f"revision manifest digest moved: {image_name}")
              alias_refs = planned.get("alias_refs")
              alias_tags = planned.get("alias_tags")
              if (
                  not isinstance(alias_refs, list)
                  or not isinstance(alias_tags, list)
                  or len(alias_refs) != len(alias_tags)
                  or len(alias_refs) != len(set(alias_refs))
              ):
                  raise SystemExit(f"frozen alias refs are invalid: {image_name}")
              subprocess.run(
                  [
                      "docker",
                      "buildx",
                      "imagetools",
                      "create",
                      "--tag",
                      semantic_ref,
                      immutable_ref,
                  ],
                  check=True,
              )
              semantic_raw = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", semantic_ref],
                  check=True,
                  capture_output=True,
              )
              if semantic_raw.stdout != revision_raw.stdout:
                  raise SystemExit(f"semantic alias digest verification failed: {image_name}")
              for alias_ref in alias_refs:
                  if alias_ref in {semantic_ref, revision_ref, immutable_ref}:
                      raise SystemExit(f"alias ref collides with revision ref: {image_name}")
                  subprocess.run(
                      [
                          "docker",
                          "buildx",
                          "imagetools",
                          "create",
                          "--tag",
                          alias_ref,
                          immutable_ref,
                      ],
                      check=True,
                  )
                  alias_raw = subprocess.run(
                      ["docker", "buildx", "imagetools", "inspect", "--raw", alias_ref],
                      check=True,
                      capture_output=True,
                  )
                  if alias_raw.stdout != revision_raw.stdout:
                      raise SystemExit(f"alias digest verification failed: {image_name}: {alias_ref}")
          PY

      - name: Remove ephemeral Docker client state
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_CONFIG:-}" ]; then
            exit 0
          fi
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/kolla-docker-*) ;;
            *) echo "Refusing unsafe Docker config cleanup: $DOCKER_CONFIG" >&2; exit 1 ;;
          esac
          rm -f -- "$DOCKER_CONFIG/config.json"

  publish-result:
    name: Report publish workflow result
    if: ${{ always() }}
    needs:
      - publish-plan
      - authorize-publish
      - build-parent-tier-0
      - build-parent-tier-1
      - build-parent-tier-2
      - build-leaf-stage-0
      - build-leaf-stage-1
      - collect-native-evidence
      - finalize-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Write result summary
        env:
          OPERATION: ${{ inputs.operation }}
          STREAM: ${{ inputs.stream }}
          SCOPE: ${{ inputs.scope }}
          PLAN_RESULT: ${{ needs.publish-plan.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorize-publish.result }}
          FINALIZE_RESULT: ${{ needs.finalize-publish.result }}
        run: |
          {
            echo "# Kolla workflow result"
            echo
            echo "- Operation: \`$OPERATION\`"
            echo "- Stream: \`$STREAM\`"
            echo "- Scope: \`$SCOPE\`"
            echo "- Plan: \`$PLAN_RESULT\`"
            if [ "$OPERATION" = "publish" ]; then
              echo "- Authorization: \`$AUTHORIZATION_RESULT\`"
              echo "- Finalize: \`$FINALIZE_RESULT\`"
            else
              echo "- Registry mutation: \`skipped\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
